name: Backend CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ dev/make-backend-runnable ]

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run alembic migrations (check)
        run: |
          # run upgrade in a dev sqlite DB so migration script validity is tested
          alembic -c backend/alembic.ini upgrade head

      - name: Run tests
        run: |
          python -m pytest -q
