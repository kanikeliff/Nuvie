name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Debug python path
      run: |
        ls -la
        find . -maxdepth 3 -type d | sed 's|^\./||'
        if [ -d "aii" ]; then
          export PYTHONPATH="."
        elif [ -d "src/aii" ]; then
          export PYTHONPATH="src"
        fi
        python -c "import os, sys; print('CWD=', os.getcwd()); print('PYTHONPATH=', os.environ.get('PYTHONPATH')); print('sys.path[0:8]=', sys.path[0:8])"
        python -c "import aii; print('aii imported from', aii.__file__)"
    
    - name: Test with pytest
      run: |
        if [ -d "aii" ]; then
          export PYTHONPATH="."
        elif [ -d "src/aii" ]; then
          export PYTHONPATH="src"
        else
          echo "ERROR: cannot find aii package at ./aii or ./src/aii"
          echo "Repo contents:"
          find . -maxdepth 3 -type d | sed 's|^\./||'
          exit 1
        fi
        echo "Using PYTHONPATH=$PYTHONPATH"
        pytest -q

